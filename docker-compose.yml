services:
  postgres:
    image: postgres:16-alpine
    container_name: nerdetatil_postgres
    environment:
      POSTGRES_USER: nerdetatil_user
      POSTGRES_PASSWORD: nerdetatil_password
      POSTGRES_DB: nerdetatil_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    networks:
      - nerdetatil_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerdetatil_user -d nerdetatil_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nerdetatil_backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DATABASE_URL: postgresql://nerdetatil_user:nerdetatil_password@postgres:5432/nerdetatil_db
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "5000:5000"
    networks:
      - nerdetatil_network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: nerdetatil_ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - nerdetatil_network
    restart: unless-stopped
    pull_policy: missing

volumes:
  postgres_data:
  ollama_data:

networks:
  nerdetatil_network:
    driver: bridge
