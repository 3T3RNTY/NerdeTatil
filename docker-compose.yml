services:
  postgres:
    image: postgres:16-alpine
    container_name: nerdetatil_postgres
    environment:
      POSTGRES_USER: nerdetatil_user
      POSTGRES_PASSWORD: nerdetatil_password
      POSTGRES_DB: nerdetatil_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - nerdetatil_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerdetatil_user -d nerdetatil_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nerdetatil_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nerdetatil_db
      DB_USER: nerdetatil_user
      DB_PASSWORD: nerdetatil_password
      PORT: 5000
      HOST: 0.0.0.0
      NODE_ENV: development
      CORS_ORIGIN: "*"
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      DATABASE_URL: postgresql://nerdetatil_user:nerdetatil_password@postgres:5432/nerdetatil_db
      CLOUDINARY_CLOUD_NAME: diyrduzus
      CLOUDINARY_API_KEY: 314912443481943
      CLOUDINARY_API_SECRET: ug9k-Q1u0WnC8AvV9sM9qv7ywi0
    ports:
      - "5000:5000"
    networks:
      - nerdetatil_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  nerdetatil_network:
    driver: bridge
